# REVIEW DRAFT: do not apply before README prerequisites. No Secret values are included.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aurora-temporal-namespace-initial
  namespace: aurora-dev
  labels:
    app.kubernetes.io/name: aurora-temporal-namespace-initial
    app.kubernetes.io/part-of: aurora-sop-execution
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora-temporal-namespace
        app.kubernetes.io/part-of: aurora-sop-execution
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: namespace
        image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
        command:
        - "/bin/sh"
        - "-ec"
        - |
          set -eu
          temporal operator cluster health --address "$TEMPORAL_ADDRESS"
          # Explicit create only: an existing namespace requires operator retention review.
          temporal operator namespace create --address "$TEMPORAL_ADDRESS" --namespace aurora-merchant-sop-dev --retention 7d
        env:
        - name: TEMPORAL_ADDRESS
          value: aurora-temporal.aurora-dev.svc.cluster.local:7233
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL

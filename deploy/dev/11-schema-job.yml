# REVIEW DRAFT: do not apply before README prerequisites. No Secret values are included.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: aurora-temporal-schema-v1-32-0
  namespace: aurora-dev
  labels:
    app.kubernetes.io/name: aurora-temporal-schema-v1-32-0
    app.kubernetes.io/part-of: aurora-sop-execution
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurora-temporal-schema
        app.kubernetes.io/part-of: aurora-sop-execution
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: schema
        image: temporalio/admin-tools:1.32.0@sha256:a9f84fb9a374b2374fe2e67c8efc0468ff3f1c66c8a0b14597ec86e349e62bca
        command:
        - "/bin/sh"
        - "-ec"
        - |
          set -eu
          # Databases and migration grants must already exist; no CREATE DATABASE here.
          for entry in aurora_temporal_dev:temporal aurora_temporal_visibility_dev:visibility; do
            database=${entry%:*}
            schema=${entry#*:}
            temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -p 5432 -u "$SQL_USER" --db "$database" setup-schema -v 0.0
            temporal-sql-tool --plugin postgres12 --ep "$POSTGRES_SEEDS" -p 5432 -u "$SQL_USER" --db "$database" update-schema -d "/etc/temporal/schema/postgresql/v12/$schema/versioned"
          done
        env:
        - name: POSTGRES_SEEDS
          value: postgresql.aurora.svc.cluster.local
        - name: SQL_USER
          valueFrom:
            secretKeyRef:
              name: aurora-temporal-schema
              key: username
        - name: SQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aurora-temporal-schema
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
